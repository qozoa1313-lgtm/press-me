<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>눌러봐</title>
<meta name="theme-color" content="#faf8f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="눌러봐">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#faf8f5; --surface:#fff; --line:#e8e3db;
  --ink:#2b2926; --ink2:#6b665f; --ink3:#9c968d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

header{
  padding:calc(env(safe-area-inset-top) + 16px) 18px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.3px}
#again{
  border:1px solid var(--line);background:var(--surface);
  padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink2);
}
#again:active{background:#f2eee8}

main{flex:1;padding:6px 18px 12px;display:flex;flex-direction:column}

/* ===== 떠다니는 버튼판 ===== */
#board{position:relative;flex:1;min-height:380px;touch-action:manipulation}
.btn{
  position:absolute;left:0;top:0;
  border-radius:20px;
  display:grid;place-items:center;
  border:1px solid rgba(0,0,0,.06);
  box-shadow:0 2px 10px rgba(80,70,55,.07);
  overflow:hidden;
  will-change:transform;
}
.btn .inner{
  width:100%;height:100%;display:grid;place-items:center;
  transition:transform .14s ease;
}
.btn:active .inner{transform:scale(.9)}
.btn .q{font-size:26px;font-weight:800;color:rgba(0,0,0,.26)}
.btn svg{width:80%;height:80%}
.btn .emo{font-size:42px;line-height:1}
.btn.open{background:var(--surface)!important;border-color:var(--line)}
.btn.pop .inner{animation:pop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{0%{transform:scale(.55) rotate(-10deg)}60%{transform:scale(1.1) rotate(4deg)}100%{transform:none}}

/* ===== 힐링 문구 ===== */
#saybox{
  position:sticky;bottom:0;
  padding:14px 18px calc(env(safe-area-inset-bottom) + 16px);
  background:linear-gradient(to top, var(--bg) 62%, rgba(250,248,245,0));
}
#say{
  min-height:52px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:15.5px;font-weight:600;line-height:1.65;
  color:var(--ink2);
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;
  opacity:0;transform:translateY(6px);
  transition:opacity .3s ease, transform .3s ease;
}
#say.on{opacity:1;transform:none}
#hint{text-align:center;font-size:12.5px;color:var(--ink3);margin:0 0 10px}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>눌러봐</h1>
    <button id="again">다시 섞기</button>
  </header>

  <main>
    <p id="hint">무엇이 나올지는 눌러봐야 압니다</p>
    <div id="board"></div>
  </main>

  <div id="saybox"><div id="say"></div></div>
</div>

<script>
/* =========================================================
   눌러봐 — 랜덤 버튼을 누르면 그림 + 소리 + 문구가 나온다
   소리·음악은 전부 CC0(저작권 무료)
   ========================================================= */

/* ---------- 그림 (SVG 5스타일 + 이모지) ---------- */
const CAT = [
  // 1 동글동글
  `<svg viewBox="0 0 100 100">
    <path d="M22 40 L20 16 L40 28 Z" fill="#F0A868"/><path d="M78 40 L80 16 L60 28 Z" fill="#F0A868"/>
    <path d="M25 38 L24 23 L36 30 Z" fill="#F7C9A8"/><path d="M75 38 L76 23 L64 30 Z" fill="#F7C9A8"/>
    <ellipse cx="50" cy="58" rx="31" ry="27" fill="#F0A868"/>
    <ellipse cx="50" cy="66" rx="17" ry="13" fill="#FBE3CE"/>
    <ellipse cx="39" cy="54" rx="4.4" ry="5.4" fill="#3B3330"/><ellipse cx="61" cy="54" rx="4.4" ry="5.4" fill="#3B3330"/>
    <circle cx="40.6" cy="52" r="1.6" fill="#fff"/><circle cx="62.6" cy="52" r="1.6" fill="#fff"/>
    <path d="M50 63 l-3.4 -3 h6.8 Z" fill="#E4776B"/>
    <path d="M50 63 v3.5 M50 66.5 q-4 3.5 -7.5 .5 M50 66.5 q4 3.5 7.5 .5" stroke="#8B7A70" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <g stroke="#C98B5E" stroke-width="1.5" stroke-linecap="round"><path d="M27 60 L13 57 M27 64 L13 65"/><path d="M73 60 L87 57 M73 64 L87 65"/></g>
  </svg>`,
  // 2 각진 심플
  `<svg viewBox="0 0 100 100">
    <path d="M24 44 L21 18 L43 31 Z" fill="#7C8794"/><path d="M76 44 L79 18 L57 31 Z" fill="#7C8794"/>
    <path d="M27 41 L25 25 L38 33 Z" fill="#C2CBD4"/><path d="M73 41 L75 25 L62 33 Z" fill="#C2CBD4"/>
    <rect x="21" y="36" width="58" height="48" rx="17" fill="#7C8794"/>
    <rect x="12" y="55" width="18" height="3" rx="1.5" fill="#B9C3CC" transform="rotate(-8 21 56)"/>
    <rect x="70" y="55" width="18" height="3" rx="1.5" fill="#B9C3CC" transform="rotate(8 79 56)"/>
    <path d="M33 55 q6 -6 12 0" stroke="#2F3438" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M55 55 q6 -6 12 0" stroke="#2F3438" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M50 66 l-3.2 -2.8 h6.4 Z" fill="#E4776B"/>
    <path d="M50 66 v3 M50 69 q-3.6 3 -6.8 .4 M50 69 q3.6 3 6.8 .4" stroke="#4A5157" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </svg>`,
  // 3 선으로만
  `<svg viewBox="0 0 100 100">
    <g fill="none" stroke="#3B3330" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 42 L23 19 L44 30"/><path d="M74 42 L77 19 L56 30"/>
      <path d="M26 42 q-6 14 0 26 q7 14 24 14 q17 0 24 -14 q6 -12 0 -26"/>
      <path d="M38 55 q5 -5 10 0"/><path d="M52 55 q5 -5 10 0"/>
      <path d="M50 68 l-3 -3 h6 Z" fill="#3B3330" stroke-width="1.6"/>
      <path d="M50 68 v3 M50 71 q-4 3.4 -7 .4 M50 71 q4 3.4 7 .4"/>
      <path d="M28 62 L14 59 M28 66 L14 68 M72 62 L86 59 M72 66 L86 68" stroke-width="2.2"/>
    </g>
  </svg>`,
  // 4 손그림
  `<svg viewBox="0 0 100 100">
    <g fill="none" stroke="#2E2A27" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 34 q1 -13 3 -14 q4 6 12 9 q11 -4 22 -1 q7 -3 11 -8 q3 3 2 13
               q7 8 6 19 q0 14 -11 21 q-9 6 -21 5 q-13 -1 -19 -10 q-6 -9 -5 -19 q0 -8 0 -15 Z"/>
      <path d="M38 45 l5 -2 l4 4 l-3 5 l-6 -2 Z"/><path d="M56 45 l6 -2 l4 4 l-3 5 l-6 -2 Z"/>
      <path d="M43 66 h11"/>
      <path d="M32 58 L14 63 M33 63 L15 70 M31 54 L17 52"/>
      <path d="M64 58 L84 56 M64 63 L84 63"/>
    </g>
  </svg>`,
  // 5 이모지
  `<span class="emo">🐱</span>`,
];

const DOG = [
  `<svg viewBox="0 0 100 100">
    <ellipse cx="24" cy="50" rx="8.5" ry="17" fill="#B57C4E" transform="rotate(-14 24 50)"/>
    <ellipse cx="76" cy="50" rx="8.5" ry="17" fill="#B57C4E" transform="rotate(14 76 50)"/>
    <ellipse cx="50" cy="55" rx="29" ry="26" fill="#D69A63"/>
    <ellipse cx="50" cy="67" rx="18" ry="13" fill="#F5DCC2"/>
    <ellipse cx="39" cy="51" rx="4.6" ry="5.4" fill="#3B3330"/><ellipse cx="61" cy="51" rx="4.6" ry="5.4" fill="#3B3330"/>
    <circle cx="40.8" cy="49" r="1.7" fill="#fff"/><circle cx="62.8" cy="49" r="1.7" fill="#fff"/>
    <ellipse cx="50" cy="62" rx="5.4" ry="4.2" fill="#3B3330"/>
    <path d="M50 66 v3.5" stroke="#8B6B52" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M43 70 q7 7 14 0 q-2 12 -7 12 q-5 0 -7 -12 Z" fill="#E4776B"/>
  </svg>`,
  `<svg viewBox="0 0 100 100">
    <path d="M20 34 L20 62 q0 10 10 10 L30 34 Z" fill="#8C6A4F"/>
    <path d="M80 34 L80 62 q0 10 -10 10 L70 34 Z" fill="#8C6A4F"/>
    <rect x="22" y="34" width="56" height="50" rx="18" fill="#C79A72"/>
    <rect x="34" y="58" width="32" height="22" rx="11" fill="#F0DCC6"/>
    <path d="M34 52 q6 -6 12 0" stroke="#2F3438" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M54 52 q6 -6 12 0" stroke="#2F3438" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <rect x="44" y="60" width="12" height="8" rx="4" fill="#2F3438"/>
    <path d="M45 71 h10 v8 q0 5 -5 5 q-5 0 -5 -5 Z" fill="#E4776B"/>
  </svg>`,
  `<svg viewBox="0 0 100 100">
    <g fill="none" stroke="#3B3330" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M27 38 q-11 2 -11 16 q0 12 11 13"/><path d="M73 38 q11 2 11 16 q0 12 -11 13"/>
      <path d="M27 38 q4 -12 23 -12 q19 0 23 12 q5 12 0 25 q-7 16 -23 16 q-16 0 -23 -16 q-5 -13 0 -25"/>
      <path d="M38 52 q5 -5 10 0"/><path d="M52 52 q5 -5 10 0"/>
      <ellipse cx="50" cy="63" rx="5" ry="3.8" fill="#3B3330" stroke-width="1.6"/>
      <path d="M50 67 v3"/><path d="M44 70 h12 v8 q0 6 -6 6 q-6 0 -6 -6 Z"/>
    </g>
  </svg>`,
  // 4 손그림 — 늘어진 귀 + 길게 나온 혀
  `<svg viewBox="0 0 100 100">
    <g fill="none" stroke="#2E2A27" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 34 q3 -10 22 -11 q19 1 22 11 q5 12 2 24 q-5 15 -24 16 q-19 -1 -24 -16 q-3 -12 2 -24 Z"/>
      <path d="M28 34 q-12 1 -14 14 q-2 14 4 21 q7 6 12 1"/>
      <path d="M72 34 q12 1 14 14 q2 14 -4 21 q-7 6 -12 1"/>
      <path d="M33 48 l7 -2 l4 5 l-4 6 l-7 -4 Z"/><path d="M58 48 l7 -2 l4 5 l-4 6 l-7 -4 Z"/>
      <path d="M47 63 l3 -2 l3 2 l-3 3 Z"/>
      <path d="M36 71 h28"/>
      <path d="M44 71 v13 q0 7 6 7 q6 0 6 -7 v-13"/><path d="M50 73 v16"/>
    </g>
  </svg>`,
  `<span class="emo">🐶</span>`,
];

// 음악 — 악보 위 음표 (도·미·솔·라·높은도)
const NOTE_Y = [80, 72, 64, 60, 52];
const NOTE_NAME = ['도','미','솔','라','도'];
const MUSIC = NOTE_Y.map((y, i) => `
  <svg viewBox="0 0 100 100">
    <g stroke="#3B3330" stroke-width="1.8" stroke-linecap="round">
      <path d="M12 40 H88"/><path d="M12 48 H88"/><path d="M12 56 H88"/><path d="M12 64 H88"/><path d="M12 72 H88"/>
    </g>
    ${i === 0 ? '<path d="M42 80 H62" stroke="#3B3330" stroke-width="1.8" stroke-linecap="round"/>' : ''}
    <path d="M63 ${y-2} V${y-30}" stroke="#3B3330" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M63 ${y-30} q10 3 9 12 q-4 -8 -9 -6 Z" fill="#3B3330"/>
    <ellipse cx="55.5" cy="${y}" rx="8.5" ry="6.2" fill="#3B3330" transform="rotate(-18 55.5 ${y})"/>
  </svg>`);

/* ---------- 힐링 문구 ---------- */
const SAYINGS = [
  '빠르게 갈 필요 없어. 멈추지만 않으면 돼.',
  '완벽하지 않아도 충분히 괜찮아.',
  '망쳐도 돼. 다시 하면 되니까.',
  '오늘 다 해내지 않아도 돼.',
  '서툰 채로 시작해도 괜찮아.',
  '늦어도 괜찮아. 내 속도로 가면 돼.',
  '틀려도 돼. 틀리면서 배우는 거니까.',
  '잘하지 못해도, 해본 것에는 의미가 있어.',
  '한 번에 잘하려고 하지 않아도 돼.',
  '조금 엉망이어도 계속 가면 돼.',
  '지금 모르는 건 잘못이 아니라 과정이야.',
  '쉬어가도 방향을 잃은 건 아니야.',
  '오늘의 최선이 작아도 괜찮아.',
  '실패해도 내가 실패한 사람인 건 아니야.',
  '결과가 별로여도 시도한 시간은 사라지지 않아.',
  '확신이 없어도 한 걸음은 내디딜 수 있어.',
  '준비가 덜 되어도 시작할 수 있어.',
  '잘하려고 애쓰기보다 그냥 해봐도 돼.',
  '넘어지는 것까지 포함해서 가는 길이야.',
  '서두르지 말자. 완벽하지 말자. 망쳐도 다시 하면 된다',
];

/* ---------- 버튼 색 (파스텔) ---------- */
const COLORS = ['#F6D9C0','#D9E7DA','#DCE2F0','#F2DCE6','#EFE7CF','#DCE9EC','#E9DDEF','#F5E0D8'];

const KINDS = [
  { key:'cat',   arts:CAT,   sfx:i => `sfx/cat${i+1}.mp3`   },
  { key:'dog',   arts:DOG,   sfx:i => `sfx/dog${i+1}.mp3`   },
  { key:'music', arts:MUSIC, sfx:i => `music/song${i+1}.mp3` },
];

const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x,y) => x[0]-y[0]).map(p => p[1]);
const $board = document.getElementById('board');
const $say = document.getElementById('say');

let music = null;   // 음악은 한 번에 하나만
let items = [];     // 떠다니는 버튼 6개
let raf = null;

function makeBoard(){
  cancelAnimationFrame(raf);
  $board.innerHTML = '';
  items = [];

  // 고양이·강아지·음악에서 각각 서로 다른 2개씩 = 6개 (중복 없음)
  const picks = [];
  for(const kind of KINDS){
    shuffle([0,1,2,3,4]).slice(0,2).forEach(v => picks.push({ kind, v }));
  }
  const colors = shuffle(COLORS).slice(0, 6);

  const W = $board.clientWidth, H = $board.clientHeight;
  const size = Math.max(74, Math.min(112, Math.floor(W / 3.4)));

  shuffle(picks).forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.style.width = b.style.height = size + 'px';
    b.style.background = colors[i];
    b.innerHTML = '<span class="inner"><span class="q">?</span></span>';
    b.onclick = () => open(b, p.kind, p.v);
    $board.appendChild(b);

    // 3열 2행 칸 안에 무작위로 흩어 놓고, 각자 다른 방향으로 천천히 움직인다
    const cw = W / 3, ch = H / 2;
    const col = i % 3, row = Math.floor(i / 3);
    const it = {
      el: b, size,
      x: col*cw + Math.random()*Math.max(1, cw - size),
      y: row*ch + Math.random()*Math.max(1, ch - size),
      vx: (Math.random() < .5 ? -1 : 1) * (0.25 + Math.random()*0.4),
      vy: (Math.random() < .5 ? -1 : 1) * (0.25 + Math.random()*0.4),
    };
    it.x = Math.min(it.x, W - size); it.y = Math.min(it.y, H - size);
    items.push(it);
  });

  $say.classList.remove('on');
  raf = requestAnimationFrame(step);
}

// 벽에 닿으면 튕기며 계속 떠다닌다
function step(){
  const W = $board.clientWidth, H = $board.clientHeight;
  for(const it of items){
    it.x += it.vx; it.y += it.vy;
    if(it.x <= 0){ it.x = 0; it.vx = Math.abs(it.vx); }
    if(it.y <= 0){ it.y = 0; it.vy = Math.abs(it.vy); }
    if(it.x >= W - it.size){ it.x = W - it.size; it.vx = -Math.abs(it.vx); }
    if(it.y >= H - it.size){ it.y = H - it.size; it.vy = -Math.abs(it.vy); }
    it.el.style.transform = `translate(${it.x}px, ${it.y}px)`;
  }
  raf = requestAnimationFrame(step);
}

function open(b, kind, v){
  // 그림 보여주기
  b.querySelector('.inner').innerHTML = kind.arts[v];
  b.classList.add('open');
  b.classList.remove('pop');
  void b.offsetWidth;              // 애니메이션 다시 걸기
  b.classList.add('pop');

  // 소리
  if(kind.key === 'music'){
    if(music){ music.pause(); }
    music = new Audio(kind.sfx(v));
    music.volume = 0.75;
    music.play().catch(()=>{});
  }else{
    const a = new Audio(kind.sfx(v));
    a.volume = 0.9;
    a.play().catch(()=>{});
  }

  // 힐링 문구
  $say.classList.remove('on');
  setTimeout(() => { $say.textContent = pick(SAYINGS); $say.classList.add('on'); }, 90);
}

document.getElementById('again').onclick = () => {
  if(music){ music.pause(); music = null; }
  makeBoard();
};

makeBoard();

if('serviceWorker' in navigator){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
