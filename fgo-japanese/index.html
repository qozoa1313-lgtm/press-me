<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カレン 보이스 일본어</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 한 화면 = 카드 한 장. 위에서 아래로 캐릭터 → 원본 보이스 → 일본어 → 히라가나 → 번역, 나머지는 접힘 */
:root{
  --bg:#f5f3f1; --card:#ffffff; --ink:#22202a; --sub:#6b6673; --line:#e6e1dd;
  --voice:#b23a5e; --voice-ink:#ffffff; --soft:#f8eef1; --study:#f3f1ee;
  --ok:#2f7d55; --tts:#3d6f93;
  --jp:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;
  --kr:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16141a; --card:#211e26; --ink:#ece8f0; --sub:#a59fae; --line:#353040;
         --voice:#e0708f; --voice-ink:#1a1016; --soft:#2c2129; --study:#29262e; --ok:#6cc596; --tts:#7fb4dc; color-scheme:dark }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--kr);font-size:16px;line-height:1.6;
     padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,summary:focus-visible{outline:2px solid var(--voice);outline-offset:2px}

/* 상단 */
.top{display:flex;align-items:center;gap:12px}
.face{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--soft);border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.who{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.who b{font-family:var(--jp);font-size:17px}
.who span{font-size:13px;color:var(--sub)}

/* 카드 */
.card{background:var(--card);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-family:var(--jp);font-size:13px;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--voice);font-weight:600}
.chip.gray{background:var(--study);color:var(--sub);font-family:var(--kr);font-weight:400}

/* 원본 보이스 버튼 — 꽉 찬 색 버튼. TTS 버튼과 모양부터 다르게 */
.voice{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:14px;
       background:var(--voice);color:var(--voice-ink);font-weight:700;font-size:16px}
.voice.playing{filter:brightness(.9)}
.voice.small{width:auto;padding:8px 14px;font-size:14px;border-radius:999px}
.voice-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--sub);margin-top:-6px}

.dots{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--voice)}
.dot.on{background:var(--voice)}

.jp{font-family:var(--jp);font-size:24px;font-weight:600;line-height:1.55;margin:0;word-break:break-word}
.reading{font-family:var(--jp);font-size:15px;color:var(--sub);margin:-6px 0 0;word-break:break-word}
.natural{font-size:19px;font-weight:700;line-height:1.5;margin:0}
.study{background:var(--study);border-radius:10px;padding:9px 12px;font-size:14.5px;color:var(--sub)}
.study small{display:block;font-size:12px;margin-bottom:2px}

/* 접는 칸 */
.panels{display:flex;flex-direction:column;gap:8px}
details{border:1px solid var(--line);border-radius:12px;background:var(--card)}
summary{list-style:none;padding:11px 14px;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--sub)}
details[open] summary::after{content:"－"}
.pbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}

.chunk{display:flex;flex-direction:column;padding:8px 10px;border-radius:10px;background:var(--study)}
.chunk .s{font-family:var(--jp);font-size:18px;font-weight:600}
.chunk .r{font-family:var(--jp);font-size:13px;color:var(--sub)}
.chunk .k{font-size:15px}

.grade{display:flex;align-items:baseline;gap:10px}
.grade b{font-size:30px;line-height:1;color:var(--voice)}
.legend{font-size:12.5px;color:var(--sub);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 10px}

.ev{border-radius:10px;background:var(--study);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.ev .reg{font-size:12px;font-weight:700;color:var(--tts);letter-spacing:.04em;text-transform:uppercase}
.ev .s{font-family:var(--jp);font-size:17px;font-weight:600}
.ev .r{font-family:var(--jp);font-size:13px;color:var(--sub)}
/* TTS 버튼 — 테두리만 있는 작은 버튼 */
.tts{align-self:flex-start;margin-top:4px;border:1.5px solid var(--tts);color:var(--tts);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600}

.kw{padding:10px 12px;border-radius:10px;background:var(--study)}
.kw .s{font-family:var(--jp);font-size:20px;font-weight:700}
.kw .r{font-family:var(--jp);font-size:14px;color:var(--sub)}
.kw .base{font-size:12.5px;color:var(--sub);margin-top:2px}

.done-btn{width:100%;padding:13px;border-radius:14px;border:2px solid var(--ok);color:var(--ok);font-weight:700;font-size:16px}
.done-msg{text-align:center;color:var(--ok);font-weight:700}

.nav{display:flex;justify-content:space-between;gap:10px}
.nav button{flex:1;padding:11px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600}
.nav button:disabled{opacity:.35;cursor:default}

.credit{font-size:11.5px;color:var(--sub);text-align:center;line-height:1.5}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
       background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;max-width:90vw;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img class="face" id="face" alt="カレン">
    <div class="who">
      <b id="name">アムール〔カレン〕</b>
      <span id="progress">오늘의 보이스</span>
    </div>
  </header>
  <main class="card" id="card"><p>불러오는 중…</p></main>
  <nav class="nav">
    <button id="prev">◀ 이전</button>
    <button id="next">다음 ▶</button>
  </nav>
  <footer class="credit">개인 학습용 · 음성·이미지 Atlas Academy · 일본어 원문 Mooncell (CC BY-NC-SA 4.0) · © TYPE-MOON / FGO PROJECT</footer>
</div>
<div class="toast" id="toast"></div>
<script src="js/store.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
