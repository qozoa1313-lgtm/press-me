<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 딱 한 문장</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FAF8F4">
<style>
:root{
  --paper:#FAF8F4; --ink:#2B2723; --soft:#8A817A; --line:#E8E1D8;
  --card:#FFFFFF; --band:#F2EDE5; --accent:#3E7C76;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-size:16px; line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
.wrap{max-width:460px;margin:0 auto;padding:18px 18px 28px}

/* ───── 공통 ───── */
.hd{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}
.hd .date{font-size:12px;letter-spacing:.14em;color:var(--soft);font-weight:700}
.hd .cnt{font-size:12px;color:var(--soft)}
.hdl{display:flex;align-items:center;gap:9px}
.hd .cnt b{color:var(--accent);font-size:15px}
h2.sec{font-size:13px;color:var(--soft);font-weight:700;margin:26px 0 10px;letter-spacing:.02em}
.btn{
  display:block;width:100%;padding:16px;border-radius:16px;background:var(--accent);
  color:#fff;font-size:16px;font-weight:700;text-align:center;margin-top:10px;
}
.btn.ghost{background:var(--band);color:var(--ink)}
.btn.ol{background:none;border:1.5px solid var(--line);color:var(--soft);font-weight:600}
.row{display:flex;gap:10px}
.row>*{flex:1 1 0;min-width:0}
.btn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){ .btn{font-size:15px;padding:16px 10px} }
.mini{font-size:13px;color:var(--soft);text-align:center;padding:12px;display:block;width:100%}
.chip{
  font-size:11px;font-weight:700;letter-spacing:0;padding:3px 9px;border-radius:999px;
  border:1.5px solid var(--line);color:var(--soft);margin-left:7px;vertical-align:middle;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hd.sticky{
  position:sticky;top:0;z-index:20;margin:0 -18px 14px;padding:10px 18px;
  background:rgba(250,248,244,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}

/* 달력 */
.cal{margin-top:6px}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhd b{font-size:15px}
.calttl{letter-spacing:.08em;font-size:14px}
.weekhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:26px 0 10px}
.weekhd .sec{letter-spacing:.06em}
/* 완료 · 복습 — 한 줄에 둘 다 */
.stat1{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.stat1>div{flex:1;display:flex;align-items:baseline;gap:6px;padding:12px 12px;min-width:0}
.stat1>div+div{border-left:1px solid var(--line)}
.stat1 span{font-size:13px;color:var(--soft);flex:none}
.stat1 b{font-size:19px;font-weight:700}
.stat1 i{margin-left:auto;font-style:normal;font-size:11px;color:var(--soft);white-space:nowrap;flex:none}
.stat1>div.tap{cursor:pointer}
/* 월 고르기 창 */
.calhd button.calttl{font-size:14px;font-weight:700;color:inherit;padding:4px 8px}
.ymnav{display:flex;align-items:center;justify-content:center;gap:20px;margin:2px 0 14px}
.ymnav b{font-size:18px}
.ymnav button{font-size:19px;color:var(--soft);padding:4px 12px}
.ymgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ymb{
  padding:13px 0;border:1.5px solid var(--line);border-radius:12px;
  font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--soft);background:var(--card);
}
.ymb.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* 기록 요약 — 누를 수 있는 칸 */
.stat div.tap{cursor:pointer}
.stat div.tap::after{content:'›';position:absolute;top:10px;right:11px;color:var(--soft);font-size:14px}
.stat div{position:relative}
/* 새 창 목록 */
.sheet .list{max-height:60vh;overflow:auto;margin-top:12px}
.sheet .li{
  display:flex;align-items:center;gap:10px;background:var(--card);
  border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;
}
.sheet .li .tx{flex:1 1 auto;min-width:0}
.sheet .li .tx b{display:block;font-size:15px}
.sheet .li .tx span{display:block;font-size:12.5px;color:var(--soft)}
.sheet .li .mk{font-size:15px;opacity:.25;flex:0 0 auto}
.sheet .li .mk.on{opacity:1}
.sheet .li[data-day]{cursor:pointer}
.sheet .li .n{font-size:11px;color:var(--soft);flex:0 0 auto}
.sheet h3{font-size:19px;margin:0 0 2px}
.sheet .cnt{font-size:13px;color:var(--soft);margin:0}
.calhd button{font-size:19px;color:var(--soft);padding:4px 14px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calgrid .dow{font-size:11px;color:var(--soft);padding-bottom:6px}
.cell{padding:7px 0 9px;border-radius:12px;font-size:13.5px;color:var(--ink);position:relative}
.cell.out{color:transparent;pointer-events:none}
.cell.sun{color:#B4675E}
.cell .dot{display:block;width:6px;height:6px;border-radius:50%;background:var(--line);margin:4px auto 0}
.cell .dot{width:7px;height:7px}
.cell.did .dot{background:#E08A3C}
.cell .dot.ico,.cell.did .dot.ico{
  width:auto;height:auto;background:none;border-radius:0;font-size:10px;line-height:1;
  margin-top:3px;
}
.cell.today{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.cell.sel{background:var(--band)}
.cell.future{color:#C9C2B8}
.cell.future .dot{background:transparent}
.dayinfo{
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:16px;margin-top:14px;font-size:14.5px;
}
.dayinfo h4{margin:0 0 10px;font-size:13px;color:var(--soft)}
.dayinfo .jump{display:block;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.dayinfo .jump:last-of-type{border-bottom:none}
.dayinfo .jump b{display:block;font-size:15px}
.dayinfo .jump span{font-size:13px;color:var(--soft)}
.learned{font-size:12.5px;color:var(--soft);margin:0 0 10px}

/* ───── 카드 ───── */
.card{
  background:var(--card);border:1.5px solid var(--line);border-radius:22px;
  padding:26px 22px;position:relative;
}
.card.today{border-color:var(--accent);border-width:2px}
.badge{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;
  color:#fff;background:var(--accent);padding:4px 9px;border-radius:7px;
}
.en{font-size:27px;font-weight:700;line-height:1.35;margin:18px 0 0;letter-spacing:-.02em}
.ko{font-size:17px;margin:14px 0 0}
.spk{
  display:block;margin:18px 0 0;margin-left:auto;font-size:24px;
  width:52px;height:52px;border-radius:50%;background:var(--band);
}
.lead{font-size:14px;color:var(--soft);margin:0}

/* ───── 펼친 내용 ───── */
.open{margin-top:18px;border-top:1px solid var(--line);padding-top:18px;font-size:15px}
.open h3{font-size:12px;color:var(--soft);font-weight:700;margin:20px 0 8px;letter-spacing:.02em}
.open h3:first-child{margin-top:0}
.bd{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}
.bd b{font-weight:700}
.bd span{color:var(--soft);font-size:14px}
.when{background:var(--band);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.65}
.sim{font-size:14.5px;color:var(--soft);line-height:1.9}
.rd{font-size:16px;letter-spacing:.02em;background:var(--band);border-radius:12px;padding:12px 14px;margin:0}

/* 접었다 펴는 칸 */
details{border-top:1px solid var(--line);padding:13px 0}
details summary{
  font-size:13px;color:var(--soft);font-weight:700;cursor:pointer;
  list-style:none;display:flex;justify-content:space-between;align-items:center;
}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'＋';font-weight:400;font-size:15px}
details[open] summary::after{content:'－'}
details .in2{padding-top:12px}
.line{padding:11px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:none;padding-bottom:0}
.line b{display:block;font-size:15.5px;font-weight:700}
.line .k{display:block;font-size:14px;color:var(--soft);margin-top:2px}
.sl{font-size:14px;margin-left:7px;opacity:.55}
/* 한글 발음 — 기본 숨김, 버튼으로 전체 켜기 */
.rdline{display:none;font-size:13.5px;color:var(--accent);margin:5px 0 0;letter-spacing:.01em}
body.showrd .rdline{display:block}
.nuance{font-size:14.5px;color:var(--soft);background:var(--band);
  border-radius:12px;padding:12px 14px;margin:10px 0 0;line-height:1.6}
/* 문장함 카드 */
details.cardbox{border:1.5px solid var(--line);border-radius:18px;
  padding:14px 16px;margin-bottom:10px;background:var(--card)}
details.cardbox>summary::after{margin-left:6px;color:var(--soft);font-size:14px}
details.cardbox>summary .item{align-items:center;gap:9px}
details.cardbox>summary .dy{font-size:10.5px}
details.cardbox .in2{border-top:1px solid var(--line);margin-top:12px}
/* 펼쳤을 때 : 영문 ~ 따라 말해보기 까지 고정 */
details.cardbox[open]>summary{
  position:sticky;top:var(--hdh,46px);z-index:12;background:var(--card);
  margin:-14px -16px 0;padding:14px 16px 8px;border-radius:16px 16px 0 0;
}
details.cardbox[open] .boxtop{
  position:sticky;top:calc(var(--hdh,46px) + var(--sumh,62px));z-index:11;
  background:var(--card);margin:0 -16px;padding:10px 16px 12px;
  border-bottom:1px solid var(--line);
}
details.cardbox details{border-top:1px solid var(--line)}

/* ───── 결과 ───── */
.heard{font-size:15px;margin:14px 0 0;line-height:1.8}
.heard i{font-style:normal;color:#C0C0C0}
.heard b{font-weight:700;color:var(--accent)}
.ok{text-align:center;padding:30px 0}
.ok .big{font-size:21px;font-weight:700}
.ok .sub{font-size:14px;color:var(--soft);margin-top:8px}
.pledge{font-size:14px;color:var(--soft);margin-top:26px;text-align:center;line-height:1.8}

/* ───── 문장함 ───── */
.item{
  display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);
}
.item .gr{font-size:18px;min-width:26px;flex:none;text-align:center;white-space:nowrap}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:15.5px;font-weight:700}
.item .tx span{display:block;font-size:13px;color:var(--soft)}
.item .dy{font-size:11px;color:var(--soft);flex:none}

/* ───── 기록 ───── */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{font-size:12.5px;color:var(--soft)}
.stat .br{display:block;margin-top:4px;font-size:11px;letter-spacing:.02em;white-space:nowrap}

/* ───── 탭바 ───── */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(250,248,244,.96);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav .in{max-width:460px;margin:0 auto;display:flex}
nav button{flex:1;padding:11px 0 13px;color:var(--soft);font-size:11px;font-weight:600}
nav button .ic{display:block;font-size:17px;margin-bottom:3px}
nav button.on{color:var(--accent)}

/* ───── 설정 / 처음 켤 때 ───── */
.field{margin:18px 0}
.field label{display:block;font-size:13px;color:var(--soft);font-weight:700;margin-bottom:7px}
textarea{
  width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--band);font:13px/1.5 ui-monospace,Consolas,monospace;color:var(--soft);
  resize:none;word-break:break-all;
}
select,input[type=text],input[type=time]{
  width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--card);font:inherit;color:inherit;
}
.pl{font-size:20px;line-height:1.9;font-weight:700;text-align:center;margin:10px 0 24px}
.pl em{font-style:normal;color:var(--accent);border-bottom:2px solid var(--accent)}
.hide{display:none!important}
/* 오늘 카드 — 윗부분(DAY · 문장 · 버튼) 통째로 고정 */
.cardtop{
  position:sticky;top:0;z-index:15;margin:-26px -22px 16px;padding:20px 22px 16px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
  border-radius:20px 20px 0 0;border-bottom:1px solid var(--line);
}
.ctrow{display:flex;align-items:center}
.cardtop .en{margin:14px 0 0}
.card.today .open{border-top:none;margin-top:4px;padding-top:0}
.okmark{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--accent)}
.fold{float:right;font-size:17px;line-height:1;color:var(--soft);padding:0 2px 4px 10px}
.card .fold.corner{position:absolute;top:16px;right:18px;float:none;padding:4px 8px;font-size:20px}
.w.bad{color:#C0392B}
/* 카드 아래에 걸쳐 앉는 버튼 */
.btn.lap{width:100%;margin:6px 0 0}
.acts{display:flex;align-items:center;gap:6px;margin-top:16px;flex-wrap:wrap}
.rnd{
  width:42px;height:42px;border-radius:50%;background:var(--band);font-size:18px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.rnd.mic{background:#E8903F;color:#fff}
.rnd.mic.on{background:#C0392B}
.tryn{font-size:12.5px;color:var(--soft);flex:1 1 100%;margin-top:2px}
.rnd{position:relative}
.rnd.key{background:#5B7FA8;color:#fff}
.rnd.got::after{
  content:'✓';position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--card);
}
/* 복습 카드 — 한국어와 버튼을 한 줄에 */
.qline{display:flex;align-items:center;gap:8px;margin-top:16px}
/* 직접 써보기 창 */
.modal{position:fixed;inset:0;z-index:60;background:rgba(43,39,35,.45);display:flex;align-items:flex-end}
.modal .sheet{
  width:100%;max-width:460px;margin:0 auto;background:var(--paper);
  border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));
}
.modal .mko{font-size:20px;font-weight:700;margin:0 0 4px}
.modal .msub{font-size:13px;color:var(--soft);margin:0 0 14px}
.modal input{
  width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;
  font:inherit;background:var(--card);color:inherit;
}
.modal input:focus{outline:none;border-color:var(--accent)}
/* 학습하기 창 — 화면 전체 */
#learnModal{z-index:55;align-items:stretch}
/* 목록 창과 써보기 창은 하단 탭보다 위에 뜹니다 */
#sheetWrap{z-index:80}
#typeModal{z-index:85}
#learnModal .sheet{border-radius:0;height:100%;overflow:auto;padding:0 18px calc(90px + env(safe-area-inset-bottom))}
.lrnhd{
  position:sticky;top:0;z-index:5;background:var(--paper);
  margin:0 -18px 0;padding:14px 18px 12px;border-bottom:1px solid var(--line);
}
.lrntop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.lrn .enrow{display:flex;align-items:center;gap:8px}
.lrn .enrow .en{flex:1 1 auto;margin:0;font-size:22px;font-weight:700;line-height:1.35}
.lrn .korow{display:flex;align-items:center;gap:8px;margin-top:18px}
.lrn .korow p{flex:1 1 auto;margin:0;font-size:18px;font-weight:700}
.lrn .sec2{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.lrn .nuance{margin-top:18px}
/* 오늘 탭 맨 아래 — 따뜻한 한 줄 */
.warm{text-align:center;margin:36px 0 6px;color:var(--soft);line-height:1.7}
.warm b{display:block;font-size:13.5px;font-weight:700}
.warm span{display:block;font-size:12.5px;margin-top:3px}
.lrn h4{font-size:12px;letter-spacing:.06em;color:var(--soft);margin:0 0 10px;font-weight:700}
.lk{font-size:12.5px;color:var(--soft);text-align:center;margin:8px 0 0}
.btn[disabled],.btn.off{opacity:.4}
@keyframes poke{
  0%,100%{box-shadow:0 0 0 0 rgba(200,130,60,0)}
  35%    {box-shadow:0 0 0 7px rgba(200,130,60,.30)}
}
.poke{animation:poke 1s ease-in-out 3}
/* 복습 — 기억났는지 고르는 칸 */
.mk3{
  flex:1;border:1.5px solid var(--line);border-radius:14px;
  padding:9px 0 8px;background:var(--card);color:var(--soft);
}
.mk3 b{display:block;font-size:17px;font-weight:700;color:var(--ink)}
.mk3 span{display:block;font-size:11px;margin-top:3px;white-space:nowrap}
/* 기록 — 자람 단계 네 칸 */
.stg{display:flex;gap:8px}
.stgb{flex:1;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:10px 0 9px}
.stgb b{display:block;font-size:16px}
.stgb span{display:block;font-size:17px;font-weight:700;margin-top:2px}
.grl{font-size:17px;margin-right:7px;vertical-align:baseline}
.ol1{font-size:14px;margin:16px 0 0}
.ol1 em{
  font-style:normal;font-weight:700;color:var(--soft);
  font-size:12.5px;letter-spacing:.04em;margin-right:7px;
}
.qm{
  width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);
  font-size:11px;font-weight:700;color:var(--soft);line-height:1;margin-left:7px;vertical-align:middle;
}
.hintline{margin-top:12px;font-size:19px;font-weight:700;letter-spacing:.06em}
.hintline .dim{color:#C9C2B8}
.rnd.key.on{outline:3px solid rgba(91,127,168,.3)}
.typebox{margin-top:14px;display:none}
.typebox.show{display:block}
.typebox input{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;
  font:inherit;background:var(--paper);color:inherit;
}
.typebox input:focus{outline:none;border-color:var(--accent)}
.typebox .go{
  display:block;width:100%;margin-top:8px;padding:13px;border-radius:14px;
  background:var(--accent);color:#fff;font-weight:700;text-align:center;
}
.blur{filter:blur(7px);user-select:none}
/* 답 확인 띠 — 듀오링고 방식 */
.fb{margin-top:14px;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:700}
.fb.ok{background:#E2F0E6;color:#2E6B4A;border-top:2px solid #A7D8B9}
.fb.no{background:#FBE6E4;color:#B4443C;border-top:2px solid #F2BDB8}
.fb .t{font-size:11.5px;letter-spacing:.04em;display:block;opacity:.75}
.fb .ans{margin-top:5px;font-size:19px;color:var(--ink)}
.fb .ans u{text-decoration-color:#C0392B;text-underline-offset:3px}
.pill{
  font-size:12.5px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;
  padding:9px 10px;margin-left:3px;color:var(--soft);white-space:nowrap;
}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* 돌아온 카드 — 접힌 줄 */
.revrow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:14px 16px;margin-top:8px;
}
.revrow .rg{font-size:18px;flex:0 0 auto}
.revrow .rt{flex:1 1 auto;min-width:0}

</style>

<!-- ══════════ 학습하기 창 ══════════ -->
<div id="learnModal" class="modal hide"><div class="sheet" id="learnBody"></div></div>

<div class="toast" id="toast"></div>

<script src="sentences.js"></script>
<script>
/* ═══════════════ 저장 ═══════════════ */
const KEY = 'oneline.v1';
const DAYCOLOR = ['#A08049','#3E7C76','#6E6AA8','#6E7C43','#96694A','#3F6E96','#8C4F63']; // 일~토
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

const todayStr = (d) => {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
};
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate()+n); return todayStr(d); };
const diffDays = (a, b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);

let DB = load();
function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY));
    if(r && r.cards) return r;
  }catch(e){}
  return null;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast('저장하지 못했습니다'); } }
/* 지난 버전에서 잘못 붙은 「복습 대상」 표시를 털어냅니다 */
function tidy(){
  const t = todayStr();
  let fixed = 0;
  Object.values(DB.cards).forEach(c => {
    if(c.learnedOn === t && (c.revive || c.due <= t)){
      delete c.revive;
      c.due = addDays(c.learnedOn, LADDER[0]);
      fixed++;
    }
  });
  if(fixed) save();
}

function fresh(time, cue){
  return { pledge:{time,cue}, startDate:todayStr(), cards:{}, days:{}, bestStreak:0, version:1 };
}

/* ═══════════════ 공통 ═══════════════ */
let tt;
/* 아직 못 누르는 버튼을 눌렀을 때 — 3초 동안 어디를 눌러야 하는지 알려줍니다 */
function poke(els, msg, box){
  els.filter(Boolean).forEach(e => {
    e.classList.remove('poke');
    void e.offsetWidth;                       /* 애니메이션을 처음부터 다시 돌립니다 */
    e.classList.add('poke');
    setTimeout(() => e.classList.remove('poke'), 3000);
  });
  if(box){
    box.textContent = msg;
    setTimeout(() => { if(box.textContent === msg) box.textContent = ''; }, 3000);
  }
}
function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('on'), 2000);
}
function paintAccent(){
  document.documentElement.style.setProperty('--accent', DAYCOLOR[new Date().getDay()]);
}
const byDay = d => SENTENCES.find(s => s.day === d);

/* 오늘 배울 새 문장 (아직 안 배운 가장 빠른 Day) */
function newToday(){
  const t = todayStr();
  for(const k in DB.days){ if(k === t && DB.days[k].newCard) return byDay(DB.cards[DB.days[k].newCard].day); }
  for(const s of SENTENCES){ if(!DB.cards[s.id]) return s; }
  return null;
}
/* 오늘 돌아올 카드 */
function dueToday(){
  const t = todayStr();
  return Object.values(DB.cards)
    .filter(c => (c.revive || c.step < LADDER.length) && c.due <= t)
    .filter(c => c.learnedOn !== t)   /* 오늘 배운 카드는 오늘 복습에 뜨지 않습니다 */
    .filter(c => !(DB.days[t] && DB.days[t].relearn || []).includes('d' + c.day))
    .sort((a,b) => a.day - b.day);
}
function maturity(step){
  if(step <= 0) return ['🌱','갓 심은 것'];
  if(step <= 1) return ['🌿','자라는 중'];
  if(step <= 3) return ['🌲','익어감'];
  return ['🌳','내 것이 됨'];
}
function streakInfo(){
  const days = Object.keys(DB.days).filter(k => DB.days[k].done).sort();
  if(!days.length) return { total:0, run:0 };
  let run = 1;
  for(let i = days.length-1; i > 0; i--){
    if(diffDays(days[i-1], days[i]) === 1) run++; else break;
  }
  const last = days[days.length-1], t = todayStr();
  if(diffDays(last, t) > 1) run = 0;
  if(run > (DB.bestStreak||0)){ DB.bestStreak = run; }
  return { total: days.length, run };
}

/* ═══════════════ 소리 ═══════════════ */
function speak(text){
  if(!('speechSynthesis' in window)) return toast('이 브라우저는 읽어주기를 지원하지 않습니다');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.88;
  speechSynthesis.speak(u);
}
const getSR = () => window.SpeechRecognition || window.webkitSpeechRecognition;
/* 마이크 권한을 먼저 직접 받아둡니다 — 설치한 앱에서 권한 창이 안 뜨는 경우가 있어서 */
function micReady(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve('no-api');
  return navigator.mediaDevices.getUserMedia({ audio:true })
    .then(st => { st.getTracks().forEach(t => t.stop()); return 'ok'; })
    .catch(e => 'denied:' + (e.name || '?'));
}

const MICMSG = {
  'no-speech'          : '소리가 안 들어왔어요',
  'audio-capture'      : '마이크를 열지 못했어요',
  'not-allowed'        : '마이크 권한이 꺼져 있어요',
  'service-not-allowed': '마이크 권한이 꺼져 있어요',
  'network'            : '인터넷이 끊겼어요',
  'aborted'            : '중간에 멈췄어요',
  'no-result'          : '말은 들어왔는데 글자로 못 바꿨어요',
};
const micSay = code => (MICMSG[code] || '마이크 오류') + ' (' + code + ')';

function listen(onResult, onFail){
  const SR = getSR();
  if(!SR){ onFail('이 브라우저는 마이크를 못 씁니다 (no-api)'); return null; }
  const WAIT  = 10000;                      /* 말을 시작할 때까지 10초 기다립니다 */
  const until = Date.now() + WAIT;
  let settled = false, dead = false, cur = null, g = null;
  const win  = a => { if(!settled){ settled = true; onResult(a); } };
  const lose = m => { if(!settled){ settled = true; onFail(m); } };

  micReady().then(st => {
    if(st.indexOf('denied') === 0){ lose(micSay('not-allowed') + ' ' + st); return; }
    attempt();
  });

  function attempt(){
    if(settled || dead) return;
    const r = new SR();
    cur = r;
    let interim = '', ended = false;
    r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;

    r.onresult = e => {
      for(let i = e.resultIndex; i < e.results.length; i++){
        const res = e.results[i];
        if(res.isFinal){
          const alts = [];
          for(let j = 0; j < res.length; j++) alts.push(res[j].transcript);
          ended = true; clearTimeout(g); win(alts);
          return;
        }
        interim = res[0].transcript;
      }
    };
    r.onerror = e => {
      if(ended) return;
      ended = true; clearTimeout(g);
      /* 아직 10초가 안 지났고 아무 말도 안 들어왔으면 조용히 다시 듣습니다 */
      if(!interim && Date.now() < until && (e.error === 'no-speech' || e.error === 'aborted')){
        setTimeout(attempt, 400); return;
      }
      lose(micSay(e.error));
    };
    r.onend = () => {
      if(ended) return;
      ended = true; clearTimeout(g);
      if(interim){ win([interim]); return; }
      if(Date.now() < until){ setTimeout(attempt, 400); return; }
      lose(micSay('no-result'));
    };

    /* 말을 시작한 뒤 너무 오래 끌면 멈춥니다 */
    g = setTimeout(() => { try{ r.stop(); }catch(e){} }, WAIT + 8000);
    try{ r.start(); }catch(e){ clearTimeout(g); lose('마이크를 열지 못했습니다 (start-fail)'); }
  }
  /* 한 번 더 누르면 듣기를 멈춥니다 — 아무 결과도 돌려주지 않습니다 */
  return { cancel(){
    dead = true; settled = true; clearTimeout(g);
    try{ if(cur) cur.abort(); }catch(e){}
  } };
}
let micJob = null;                 /* 지금 듣고 있는 마이크 (한 번에 하나) */
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
function compare(target, heard){
  const want = norm(target).split(' ').filter(Boolean);
  const got  = norm(heard).split(' ').filter(Boolean);
  const pool = got.slice();
  const marks = want.map(w => {
    const i = pool.indexOf(w);
    if(i >= 0){ pool.splice(i,1); return true; }
    return false;
  });
  const hit = marks.filter(Boolean).length;
  // 화면에는 원래 대소문자 그대로 보여준다
  const raw = target.split(/\s+/).map(t => t.replace(/[^A-Za-z0-9']/g,'')).filter(Boolean);
  return { marks, want: raw.length === want.length ? raw : want, rate: want.length ? hit / want.length : 0 };
}

/* ═══════════════ 오늘 화면 ═══════════════ */
let stage = null;   // {mode:'new'|'review'|'done', queue:[], idx}

function renderToday(){
  paintAccent();
  const d = new Date();
  document.getElementById('hdDate').textContent = MON[d.getMonth()] + ' ' + String(d.getDate()).padStart(2,'0');
  document.getElementById('hdCnt').textContent = Object.keys(DB.cards).length;
  const si = streakInfo();
  document.getElementById('hdStreak').textContent = si.run ? ('총 ' + si.total + '일 중 ' + si.run + '일 연속') : ('총 ' + si.total + '일');

  const body = document.getElementById('todayBody');
  const t = todayStr();
  if(!DB.days[t]) DB.days[t] = { opened:true };

  const n = newToday();
  const due = dueToday();
  const newPending = n && !DB.days[t].newDone;
  const relearnId = (DB.days[t].relearn || [])[0];
  const relearn = relearnId && DB.cards[relearnId] ? byDay(DB.cards[relearnId].day) : null;

  if(relearn){
    if(!stage || stage.card !== relearn) micTries = 0;
    stage = { mode:'new', card:relearn };
    body.innerHTML = '<p class="lead" style="margin-bottom:8px">다시 학습</p>'
      + viewNew(relearn)
      + (newPending ? `<div class="tdone" style="margin-top:14px">이걸 끝내면 오늘의 새 문장 <b>DAY ${n.day} · ${n.en}</b> 이 이어서 나옵니다</div>` : '')
      + viewRevSection(due);
  }else if(newPending){
    if(!stage || stage.card !== n) micTries = 0;
    stage = { mode:'new', card:n };
    body.innerHTML = viewNew(n) + viewRevSection(due);
  }else{
    /* 오늘 것을 끝냈어도 카드는 그대로 둡니다 — ✓ 완료 표시만 붙습니다 */
    const id = DB.days[t].newCard, c = id && DB.cards[id];
    stage = c ? { mode:'new', card: byDay(c.day), done:true } : { mode:'done' };
    body.innerHTML = (c ? viewNew(byDay(c.day), true) : '')
      + viewRevSection(due)
      + (due.length ? '' : viewDone());
  }

  body.insertAdjacentHTML('beforeend', warmHTML());
  wireToday();
  save();
}

/* 카드 속 내용 — 오늘 화면과 문장함이 같이 씁니다 */
function detailHTML(s, open){
  const lines = arr => arr.map(e => `
    <div class="line">
      <b>${e[0]}<button class="sl" data-speak="${esc(e[0].replace(/^[AB]:\s*/,''))}">🔊</button></b>
      <span class="k">${e[1]}</span>
      <span class="rdline">${e[2]}</span>
    </div>`).join('');
  return `
    <details${open === false ? '' : ' open'}><summary>단어 쪼개보기</summary>
      <div class="in2"><div class="bd">${s.bd.map(p=>`<b>${p[0]}</b><span>${p[1]}</span>`).join('')}</div></div>
    </details>
    <details><summary>💬 이런 순간에</summary>
      <div class="in2"><div class="when">${s.when}</div></div>
    </details>
    <details><summary>이렇게 써요</summary><div class="in2">${lines(s.ex)}</div></details>
    <details><summary>비슷한 표현</summary><div class="in2">${lines(s.sim)}</div></details>`;
}

/* ─── 새 문장 ─── */
/* 직접 써본 것과 정답을 단어 하나하나 맞춰봅니다 (엄격 — 줄임말·철자 그대로) */
function typeCheck(typed, target){
  const cut = x => x.replace(/[.!?,;:]+$/,'');
  const want = target.split(/\s+/).map(cut);
  const got  = typed.trim().split(/\s+/).map(cut).filter(Boolean)
                    .map(w => ({ raw:w, low:w.toLowerCase(), used:false }));
  const marks = want.map(w => {
    const g = got.find(x => !x.used && x.low === w.toLowerCase());
    if(g){ g.used = true; return true; }
    return false;
  });
  const hit = marks.filter(Boolean).length;
  return { want, marks, extra: got.filter(x => !x.used).map(x => x.raw),
           rate: want.length ? hit/want.length : 0 };
}

function typeResult(target, typed){
  const r = typeCheck(typed, target);
  if(r.rate === 1 && !r.extra.length) return '<div class="fb ok">정답!</div>';
  const words = r.want.map((w,i) => r.marks[i] ? w : `<u>${w}</u>`).join(' ');
  return `<div class="fb no"><span class="t">정답</span><div class="ans">${words}</div></div>`;
}

/* ─── 직접 써보기 창 ─── */
let typeCtx = null;              /* { en, ko, key, tries, onWin } */
const typeTries = {};            /* 카드별 틀린 횟수 */

function openType(en, ko, key, onWin){
  typeCtx = { en, ko, key, onWin };
  typeTries[key] = typeTries[key] || 0;
  document.getElementById('mKo').textContent = ko;
  document.getElementById('mIn').value = '';
  document.getElementById('mMsg').innerHTML = hintHTML(en, key);
  document.getElementById('typeModal').classList.remove('hide');
  setTimeout(() => document.getElementById('mIn').focus(), 50);
}
function closeType(){
  document.getElementById('typeModal').classList.add('hide');
  typeCtx = null;
}
/* 3번 틀릴 때마다 글자를 한 자씩 열어줍니다 */
function hintHTML(en, key){
  const n = Math.floor((typeTries[key] || 0) / 3);
  if(n <= 0) return '';
  const words = en.split(/\s+/).map(w => {
    const show = w.slice(0, n);
    const rest = w.slice(n).replace(/[A-Za-z0-9']/g, '·');
    return show + '<span class="dim">' + rest + '</span>';
  }).join(' ');
  return '<div class="hintline">' + words + '</div>';
}

/* 문장을 단어 단위로 쪼개 둡니다 — 틀린 단어만 빨갛게 칠하려고요 */
function wordSpans(en){
  return en.split(/\s+/).map(w => `<span class="w">${w}</span>`).join(' ');
}

function viewNew(s, done){
  return `
  <div class="card today">
    <div class="cardtop">
      <div class="ctrow"><span class="badge">DAY ${s.day}</span>${done ? '<span class="okmark">✓ 완료</span>' : ''}</div>
      <p class="en" id="enLine"><span class="grl">${maturity(DB.cards[s.id] ? DB.cards[s.id].step : 0)[0]}</span>${wordSpans(s.en)}</p>
      <p class="rdline">${s.rd}</p>

/* 듣기 · 말하기 · 쓰기를 다 해야 열립니다. 끝낸 날도 예외 없습니다 */
function canLearn(){
  const d = DB.days[todayStr()] || {};
  return !!(d.earOK && d.micOK && d.keyOK);
}
/* 지금 학습할 문장 — 다시 학습 > 오늘 끝낸 것 > 오늘의 새 문장 */
function learnCard(){
  const d = DB.days[todayStr()] || {};
  const rid = (d.relearn || [])[0];
  if(rid && DB.cards[rid]) return byDay(DB.cards[rid].day);
  if(d.newDone && d.newCard && DB.cards[d.newCard]) return byDay(DB.cards[d.newCard].day);
  return newToday();
}

function closeLearn(){ document.getElementById('learnModal').classList.add('hide'); }
function openLearn(){
  const s = learnCard();
  if(!s) return toast('오늘 배울 문장이 없습니다');
  if(!canLearn()) return toast('먼저 듣고 · 말하고 · 써보세요');
  const d = DB.days[todayStr()] || {};
  document.getElementById('learnBody').innerHTML = learnHTML(s, !!d.newDone);
  document.getElementById('learnModal').classList.remove('hide');
  wireLearn(s, !!d.newDone);
}
function wireLearn(s, done){
  const box = document.getElementById('learnBody');
  box.scrollTop = 0;
  box.querySelectorAll('[data-speak]').forEach(b => b.onclick = () => speak(b.dataset.speak));

  const rd = document.getElementById('lrnRd');
  const sync = () => rd.classList.toggle('on', document.body.classList.contains('showrd'));
  sync();
  rd.onclick = () => { document.body.classList.toggle('showrd'); sync(); };

  document.getElementById('lrnYg').onclick = () =>
    window.open('https://youglish.com/pronounce/' + encodeURIComponent(s.en.replace(/[^\w\s']/g,'')) + '/english', '_blank');

  const say = t => { const e = document.getElementById('lrnTry'); if(e) e.innerHTML = t; };
  /* 말하기와 쓰기를 둘 다 해야 완료하기가 눌립니다 */
  const syncDone = () => {
    const dd = DB.days[todayStr()] || {};
    const ok = !done && dd.lrnMicOK && dd.lrnKeyOK;
    document.getElementById('lrnDone').classList.toggle('off', !ok);
  };
  const paint = marks => document.querySelectorAll('#lrnEn .w')
    .forEach((w,i) => w.classList.toggle('bad', marks ? marks[i] === false : false));

  const mic = document.getElementById('lrnMic');
  mic.onclick = () => {
    if(micJob){ micJob.cancel(); micJob = null; mic.classList.remove('on'); say(''); return; }
    paint(null); mic.classList.add('on'); say('듣는 중… (한 번 더 누르면 멈춥니다)');
    micJob = listen(alts => {
      micJob = null;
      mic.classList.remove('on');
      let best = { rate:-1 };
      alts.forEach(a => { const r = compare(s.en, a); if(r.rate > best.rate) best = r; });
      paint(best.marks);
      if(best.rate >= 0.8){
        say('<b style="color:var(--accent)">' + Math.round(best.rate*100) + '% · 통과!</b>');
        DB.days[todayStr()].lrnMicOK = true; mic.classList.add('got'); save(); syncDone();
      }else{
        say(Math.round(best.rate*100) + '% — 빨간 단어를 다시');
      }
    }, msg => {
      micJob = null;
      mic.classList.remove('on');
      if(msg) say('<b style="color:#C0392B">' + msg + '</b>');
    });
  };

  const key = document.getElementById('lrnKey');
  key.onclick = () => openType(s.en, s.ko, 'learn-' + s.day, () => {
    DB.days[todayStr()].lrnKeyOK = true; key.classList.add('got'); save(); syncDone();
  });

  document.getElementById('lrnClose').onclick = closeLearn;
  document.getElementById('lrnDone').onclick = () => {
    const dd = DB.days[todayStr()] || {};
    const lk = document.getElementById('lrnLk');
    if(done){ poke([], '오늘은 이미 완료했어요', lk); return; }
    if(!(dd.lrnMicOK && dd.lrnKeyOK)){
      poke([!dd.lrnMicOK && mic, !dd.lrnKeyOK && key], '읽어보고 써보세요', lk);
      return;
    }
    closeLearn(); finishNew(s);
  };
}

let micTries = 0;
const MICNEED = 3;
const micLabel = () => '🎙 발음 체크해보기' + (micTries ? ' (' + Math.min(micTries, MICNEED) + '/' + MICNEED + ')' : '');

function wireToday(){
  document.querySelectorAll('[data-speak]').forEach(b =>
    b.onclick = () => speak(b.dataset.speak));

  const rdBtn = document.getElementById('rdBtn');
  if(rdBtn){
    const sync = () => rdBtn.classList.toggle('on', document.body.classList.contains('showrd'));

    rdBtn.onclick = () => { document.body.classList.toggle('showrd'); sync(); };
  }

  const openBtn = document.getElementById('openBtn');
  if(openBtn) openBtn.onclick = () => {
    if(canLearn()){ openLearn(); return; }
    const d = DB.days[todayStr()] || {};

         '듣고 · 말하고 · 써보세요', document.getElementById('lkMsg'));
  };

  /* 들어보기 — 한 번 들으면 체크 */
  const earBtn = document.getElementById('earBtn');
  if(earBtn) earBtn.onclick = () => {
    speak(stage.card.en);
    if(!DB.days[todayStr()].earOK){
      DB.days[todayStr()].earOK = true; save(); renderToday();
    }
  };

  const micBtn = document.getElementById('micBtn');
  const paintWords = marks => {
    const ws = document.querySelectorAll('#enLine .w');
    ws.forEach((w,i) => w.classList.toggle('bad', marks ? marks[i] === false : false));
  };
  const unlock = () => { const u = document.getElementById('unlock'); if(u) u.classList.remove('hide'); };
  const tryText = t => { const e = document.getElementById('tryN'); if(e) e.innerHTML = t; };

  const runMic = () => {
    const s = stage.card, out = document.getElementById('micOut');
    if(micJob){ micJob.cancel(); micJob = null; micBtn.classList.remove('on'); tryText(''); return; }
    paintWords(null);
    micBtn.classList.add('on');
    tryText('듣는 중… (한 번 더 누르면 멈춥니다)');
    micJob = listen(alts => {
      micJob = null;
      micBtn.classList.remove('on');
      let best = { rate:-1 };
      alts.forEach(a => { const r = compare(s.en, a); if(r.rate > best.rate) best = r; });
      micTries++;
      out.innerHTML = '';
      paintWords(best.marks);
      if(best.rate >= 0.8){
        tryText('<b style="color:var(--accent)">' + Math.round(best.rate*100) + '% · 통과!</b>');
        DB.days[todayStr()].micOK = true;
        save(); renderToday();
        return;
      }
      tryText(micTries + ' / ' + MICNEED + ' · ' + Math.round(best.rate*100) + '% — 빨간 단어를 다시');
      if(micTries >= MICNEED) unlock();
    }, msg => {
      micJob = null;
      micBtn.classList.remove('on');
      if(!msg) return;
      tryText('<b style="color:#C0392B">' + msg + '</b>');   /* 실패 횟수는 세지 않습니다 */
      unlock();
    });
  };
  if(micBtn) micBtn.onclick = runMic;

  /* 오늘 카드 — 직접 써보기 (창으로 띄웁니다) */
  const keyBtn = document.getElementById('keyBtn');

    const s = stage.card;

      save(); renderToday();
    });
  };

  const revFold = document.getElementById('revFold');

  const againBtn = document.getElementById('againBtn');
  if(againBtn) againBtn.onclick = runMic;

  /* 세 번 해도 안 되면 이 단계만 넘어갑니다 */
  const doneBtn = document.getElementById('doneBtn');
  if(doneBtn) doneBtn.onclick = () => {
    DB.days[todayStr()].micOK = true; save(); renderToday();
  };

  const showAns = () => {
    document.getElementById('ansBox').classList.remove('hide');
    document.getElementById('markBox').classList.remove('hide');
    const ab = document.getElementById('ansBtn');
    if(ab) ab.classList.add('hide');
    document.querySelectorAll('[data-speak]').forEach(b => b.onclick = () => speak(b.dataset.speak));
    document.querySelectorAll('[data-mark]').forEach(b => b.onclick = () => mark(b.dataset.mark));
  };

  const ansBtn = document.getElementById('ansBtn');
  if(ansBtn) ansBtn.onclick = showAns;

  /* 복습 카드 — 직접 써보기 (창으로 띄웁니다) */

  if(rvKey) rvKey.onclick = () => {
    const c = DB.cards['d' + openRev];

      c.todayDone = Object.assign({ d: todayStr() }, c.todayDone, { key:true });
      c.log.push({ d: todayStr(), m:'type' });
      save(); renderToday();
    });
  };

  /* 복습 카드 — 말해보고 답 확인하기 */

    const c = DB.cards['d' + openRev];
    if(!c) return;
    const en = byDay(c.day).en;
    const tr = document.getElementById('revTry');
    if(micJob){ micJob.cancel(); micJob = null; revMic.classList.remove('on'); tr.textContent = ''; return; }
    revMic.classList.add('on');
    tr.textContent = '듣는 중… (한 번 더 누르면 멈춥니다)';
    micJob = listen(alts => {
      micJob = null;
      revMic.classList.remove('on');
      let best = { rate:-1 };
      alts.forEach(a => { const r = compare(en, a); if(r.rate > best.rate) best = r; });
      if(best.rate >= 0.8){
        tr.innerHTML = '<b style="color:var(--accent)">' + Math.round(best.rate*100) + '% · 맞았어요</b>';
        c.todayDone = Object.assign({ d: todayStr() }, c.todayDone, { mic:true });
        c.log.push({ d: todayStr(), m:'speak' });
        save(); revMic.classList.add('got');
      }else{
        tr.innerHTML = Math.round(best.rate*100) + '% 들렸어요 · 다시 해볼까요?';
      }
    }, msg => {
      micJob = null;
      revMic.classList.remove('on');
      if(!msg) return;
      tr.innerHTML = '<b style="color:#C0392B">' + msg + '</b>';
    });
  };

  document.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => {
    openRev = +b.dataset.rev;
    renderToday();
    setTimeout(() => {
      const el = document.querySelector('#todayBody .card');
      const all = document.querySelectorAll('#todayBody .card');
      (all[all.length-1] || el).scrollIntoView({ behavior:'smooth', block:'center' });
    }, 40);
  });

  const goBox = document.getElementById('goBox');
  if(goBox) goBox.onclick = () => switchTab('Box');
}

function finishNew(s){
  const t = todayStr();
  const old = DB.cards[s.id];
  if(old){
    /* 복구해서 다시 익힌 경우 — 기억 단계만 처음으로, 배운 날짜와 기록은 남깁니다 */
    old.step = 0;
    old.due = addDays(t, LADDER[0]);
    old.log.push({ d:t, m:'relearn' });
    delete old.revive;
    DB.days[t].relearn = (DB.days[t].relearn || []).filter(x => x !== s.id);
    DB.days[t].done = true;
    stage = null; save(); renderToday();
    toast('다시 익혔습니다');
  }else{
    const lg = [{ d:t, m:'new' }];
    if(DB.days[t].micOK) lg.push({ d:t, m:'speak' });
    if(DB.days[t].keyOK) lg.push({ d:t, m:'type' });
    DB.cards[s.id] = { day:s.day, learnedOn:t, step:0, due:addDays(t,LADDER[0]), log:lg, fav:false };
    DB.days[t] = Object.assign(DB.days[t]||{}, { newCard:s.id, newDone:true, done:true });
    stage = null; save(); renderToday();
    toast('문장함에 꽂혔습니다');
  }
}

function mark(m){
  const c = DB.cards['d' + openRev], t = todayStr();
  if(!c) return;
  c.log.push({ d:t, m });
  delete c.revive;
  if(m === 'ok'){
    c.step++;
    c.due = c.step < LADDER.length ? addDays(t, LADDER[c.step] - (LADDER[c.step-1]||0)) : addDays(t, 365);
  }else{
    c.due = addDays(t, 1);
    if(m === 'no' && c.step > 0) c.step--;
  }
  DB.days[t] = Object.assign(DB.days[t]||{}, { done:true });
  openRev = null;
  save(); renderToday();
}

/* ═══════════════ 달력 ═══════════════ */
const MONSHORT = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const enDate = d => MONSHORT[+d.slice(5,7) - 1] + ' ' + (+d.slice(8,10));
const MONTHFULL = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY',

let calYM = null, calSel = null, ymY = null;

/* 월 고르기 창 — 글자는 전부 영문 */
function ymSheet(){
  const grid = MONSHORT.map((mm, i) =>
    `<button class="ymb${(ymY === calYM.y && i === calYM.m) ? ' on' : ''}" data-ym="${i}">${mm}</button>`

    </div>`;
}

/* 하루치 기록을 모은다 */
function dayLog(date){
  const made = [], back = { ok:0, mid:0, no:0, reset:0 };
  Object.values(DB.cards).forEach(c => c.log.forEach(l => {
    if(l.d !== date) return;
    if(l.m === 'new') made.push(c.day);
    else if(back[l.m] !== undefined) back[l.m]++;
  }));
  const any = made.length || back.ok || back.mid || back.no || back.reset;
  return { made, back, any };
}

/* ─── 목록 창 ─── */
const RVM = { ok:1, mid:1, no:1 };      /* 복습 표시 세 가지 */
function openSheet(html, bare){
  const b = document.getElementById('sheetBody');
  b.innerHTML = html;
  document.getElementById('sheetClose').classList.toggle('hide', !!bare);
  document.getElementById('sheetWrap').classList.remove('hide');
  b.querySelectorAll('[data-speak]').forEach(x => x.onclick = e => {
    e.stopPropagation();                      /* 줄 전체를 누른 것으로 치지 않습니다 */
    speak(x.dataset.speak);
  });
  b.querySelectorAll('[data-day]').forEach(x => x.onclick = () => { closeSheet(); openInBox(+x.dataset.day); });
  b.querySelectorAll('[data-ymv]').forEach(x => x.onclick = () => { ymY += +x.dataset.ymv; openSheet(ymSheet(), 1); });
  b.querySelectorAll('[data-ymx]').forEach(x => x.onclick = closeSheet);
  b.querySelectorAll('[data-ym]').forEach(x => x.onclick = () => {
    calYM = { y: ymY, m: +x.dataset.ym }; calSel = null;
    closeSheet(); renderLog();
  });
  b.querySelectorAll('[data-ymt]').forEach(x => x.onclick = () => {
    const n = new Date();
    calYM = { y: n.getFullYear(), m: n.getMonth() }; calSel = null;
    closeSheet(); renderLog();
  });
}
function closeSheet(){ document.getElementById('sheetWrap').classList.add('hide'); }

/* 완료한 문장 전부 */
function doneSheet(){
  const cards = Object.values(DB.cards).sort((a,b) => b.day - a.day);
  const rows = cards.map(c => {
    const s = byDay(c.day), [gr] = maturity(c.step);
    return `<div class="li" data-day="${s.day}"><span class="mk on">${gr}</span>
      <span class="tx"><b>${s.en}</b><span>${s.ko}</span></span>
      <span class="n">DAY ${s.day}</span></div>`;
  }).join('') || '<p class="lead">아직 없습니다.</p>';
  return `<h3>완료한 문장</h3><p class="cnt">${cards.length}장</p><div class="list">${rows}</div>`;
}

/* 0.5 는 0.5 로, 1 은 1 로 적습니다 */
const half2 = n => (n % 1 ? n.toFixed(1) : String(n));

/* 지금까지 복습한 문장 */
function revSheet(from){
  const f = from || '';
  const rows = [];
  let sp = 0, ty = 0, times = 0;
  Object.values(DB.cards).sort((a,b) => b.day - a.day).forEach(c => {
    const mine = c.log.filter(l =>
      l.d >= f && l.m !== 'new' && l.m !== 'relearn' && l.d !== c.learnedOn);
    if(!mine.length) return;
    const mic = mine.some(l => l.m === 'speak');
    const key = mine.some(l => l.m === 'type');
    if(mic) sp++;
    if(key) ty++;
    const half = (mine.filter(l => l.m === 'speak').length
                + mine.filter(l => l.m === 'type').length) / 2;
    times += half;
    const s = byDay(c.day);
    const n = half;
    rows.push(`<div class="li" data-day="${s.day}">
      <span class="tx"><b>${s.en}</b><span>${s.ko}</span></span>
      <span class="n">총 ${half2(n)}번</span>
      <span class="mk${mic ? ' on' : ''}">🎙</span>
      <span class="mk${key ? ' on' : ''}">⌨</span></div>`);
  });
  return `<h3>복습한 문장</h3>
    <p class="cnt">총 ${half2(times)}번 · 🎙 ${sp}장 · ⌨ ${ty}장</p>
    <div class="list">${rows.join('') || '<p class="lead">아직 없습니다.</p>'}</div>`;
}

function renderCal(){
  const now = new Date();
  if(!calYM) calYM = { y: now.getFullYear(), m: now.getMonth() };
  const { y, m } = calYM;
  const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  const start = first.getDay(), days = last.getDate(), t = todayStr();

  let cells = '';
  for(let i = 0; i < start; i++) cells += '<div class="cell out">.</div>';
  for(let d = 1; d <= days; d++){
    const ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const g = dayLog(ds);
    const mk = g.made[0] && DB.cards['d' + g.made[0]];
    const ico = mk ? maturity(mk.step)[0] : '';
    cells += `<button class="cell${g.any?' did':''}${ds===t?' today':''}${ds===calSel?' sel':''}${(start+d-1)%7===0?' sun':''}${ds>t?' future':''}" data-d="${ds}">
      ${d}<span class="dot${ico?' ico':''}">${ico}</span></button>`;
  }

  const monthDone = (() => { let n = 0;
    for(let d = 1; d <= days; d++){
      const ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      if(dayLog(ds).any) n++;
    } return n; })();

  return `<div class="cal">
    <div class="calhd">
      <button data-mv="-1">‹</button>
      <button class="calttl" id="ymBtn">${MONTHFULL[m]} ${y} ▾</button>
      <button data-mv="1">›</button>
    </div>
    <div class="calgrid">
      ${['일','월','화','수','목','금','토'].map(x=>`<div class="dow">${x}</div>`).join('')}
      ${cells}
    </div>
  </div>`;
}

/* 자람 네 단계 — 🌱 0번 → ✦ 4번 이상 맞힘 */

  ['🌿','1번',    c => c.step === 1,                '한 번 맞혔습니다'],
  ['🌲','2~3번',  c => c.step >= 2 && c.step <= 3,  '자리를 잡아가는 중입니다'],
  ['🌳','4번 이상', c => c.step >= 4,                '거의 내 것이 된 문장입니다']

function stgSheet(i){
  const g = STG[i];

      <button class="mk on" data-speak="${esc(x.en)}">🔊</button></div>`;

/* 달력에서 고른 하루 — 새 창 */
function daySheet(date){
  const [y, m, d] = date.split('-').map(Number);
  const g = dayLog(date);
  let body;
  if(!g.any){
    body = '<p class="lead">이 날은 쉬었어요.</p>';
  }else{
    const marks = [];
    if(g.back.ok)  marks.push('✓' + g.back.ok);
    if(g.back.mid) marks.push('△' + g.back.mid);
    if(g.back.no)  marks.push('✕' + g.back.no);
    body = g.made.map(day => { const s = byDay(day);
      return `<div class="li">
          <span class="mk on" style="font-size:11px;color:var(--soft)">DAY ${day}</span>
          <span class="tx"><b>${s.en}</b></span>
          <button class="mk on" data-speak="${esc(s.en)}">🔊</button>
        </div>
        <button class="btn ol" data-day="${day}" style="margin:0 0 14px">문장함에서 보기</button>`;
    }).join('') +
    (marks.length ? `<p class="lead" style="margin:0">복습 ${g.back.ok+g.back.mid+g.back.no}장 (${marks.join(' ')})</p>` : '') +
    (g.back.reset ? `<p class="lead" style="margin:6px 0 0">처음부터 다시 돌린 카드 ${g.back.reset}장</p>` : '');
  }
  return `<h3>${m}월 ${d}일</h3><div class="list">${body}</div>`;
}

function wireCal(){
  const root = document.getElementById('logBody');
  root.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
    calYM.m += +b.dataset.mv;
    if(calYM.m < 0){ calYM.m = 11; calYM.y--; }
    if(calYM.m > 11){ calYM.m = 0; calYM.y++; }
    calSel = null; renderLog();
  });
  const yb = root.querySelector('#ymBtn');
  if(yb) yb.onclick = () => { ymY = calYM.y; openSheet(ymSheet(), 1); };
  root.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    calSel = b.dataset.d;
    root.querySelectorAll('[data-d]').forEach(x => x.classList.toggle('sel', x.dataset.d === calSel));
    openSheet(daySheet(calSel));
  });
}

/* 달력 → 문장함으로 넘어가며 그 카드를 펼친다 */
function openInBox(day){
  switchTab('Box');
  setTimeout(() => {
    const el = document.querySelector(`#boxBody details.cardbox[data-day="${day}"]`);
    if(!el) return;
    el.open = true;
    el.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 60);
}

/* ═══════════════ 기록 ═══════════════ */
function renderLog(){
  const t = todayStr(), d = new Date();
  const mon = addDays(t, -((d.getDay()+6)%7));
  const cards = Object.values(DB.cards);
  const si = streakInfo();

  /* 큰 숫자 = 전체 / 작은 글씨 = 이번 주 */
  let doneAll = 0, doneWk = 0, revAll = 0, revWk = 0;
  cards.forEach(c => c.log.forEach(l => {
    const wk = l.d >= mon;
    if(l.m === 'new'){ doneAll++; if(wk) doneWk++; }
    else if(RVM[l.m]){ revAll++; if(wk) revWk++; }
  }));

  document.getElementById('logBody').innerHTML = renderCal() + `
    <div class="weekhd">
      <h2 class="sec" style="margin:0">SUMMARY</h2>
    </div>
    <div class="stat1">
      <div class="tap" id="statDone"><span>완료</span><b>${doneAll}</b><i>이번주 +${doneWk}</i></div>
      <div class="tap" id="statRev"><span>복습</span><b>${revAll}</b><i>이번주 +${revWk}</i></div>
    </div>
    <p class="ol1"><em>연속 :</em>총 ${si.total}일 중 <b>${si.run}일 연속</b>${DB.bestStreak ? ' · 최고 ' + DB.bestStreak + '일' : ''}</p>
    <h2 class="sec">복습 현황<button class="qm" id="stgQ">?</button></h2>
    <div class="stg">
      ${STG.map((g,i) => `<button class="stgb" data-stg="${i}">
        <b>${g[0]}</b><span>${cards.filter(g[2]).length}</span></button>`).join('')}
    </div>
    <p class="ol1"><em>진도 :</em>30장 중 <b>${cards.length}장</b>을 모았습니다</p>`;
  wireCal();
  const sd = document.getElementById('statDone');
  if(sd) sd.onclick = () => openSheet(doneSheet());
  const sr = document.getElementById('statRev');
  if(sr) sr.onclick = () => openSheet(revSheet());
  document.querySelectorAll('[data-stg]').forEach(b =>
    b.onclick = () => openSheet(stgSheet(+b.dataset.stg)));
  const sq = document.getElementById('stgQ');
  if(sq) sq.onclick = () => openSheet(stgHelp());
}

    <h2 class="sec">아침 알림</h2>

    <button class="btn ghost" id="pushBtn">알림 받기 켜기</button>
    <button class="btn ol hide" id="testBtn">알림 미리 보기</button>
    <div id="subBox" class="hide">

    <h2 class="sec">기록</h2>
    <button class="btn ghost" id="expBtn">기록 내보내기</button>
    <button class="btn ghost" id="impBtn">기록 불러오기</button>

       한 달에 한 번쯤 내보내 두세요.</p>

    <h2 class="sec">다음 달 설계용</h2>
    <button class="btn ol" id="repBtn">30일 보고서 내보내기</button>
    <p class="lead" style="font-size:13px">30일을 채우면 이 파일을 클로드에게 주세요.

/* ─── 아침 알림(웹 푸시) ─── */
const VAPID_PUBLIC = 'BHLjas_POgCZAtOvZac024GydyJ-5BVmClLUrY_9S0YL5sygM5Y3iPxsn57k0D--142E7K5wsN9c70qXuxSDiCY';
function b64ToBytes(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function wirePush(){
  const state = document.getElementById('pushState');
  const btn   = document.getElementById('pushBtn');
  const test  = document.getElementById('testBtn');
  const box   = document.getElementById('subBox');

  if(!('serviceWorker' in navigator) || !('PushManager' in window) || location.protocol === 'file:'){
    state.textContent = '이 브라우저에서는 알림을 쓸 수 없습니다. 폰 시계 알람을 써주세요.';
    btn.classList.add('hide'); return;
  }
  const reg = await navigator.serviceWorker.ready.catch(() => null);
  if(!reg){ state.textContent = '알림 준비에 실패했습니다.'; return; }

  const show = async () => {
    const sub = await reg.pushManager.getSubscription();
    if(Notification.permission === 'denied'){
      state.textContent = '알림이 차단돼 있습니다. 폰 설정 → 앱 → 알림에서 켜주세요.';
      btn.classList.add('hide'); return;
    }
    if(sub){
      state.innerHTML = '<b>알림 받기가 켜져 있습니다.</b>';
      btn.textContent = '등록 코드 다시 보기';
      test.classList.remove('hide');
      document.getElementById('subTxt').value = JSON.stringify(sub);
    }else{
      state.textContent = '깃허브가 매일 아침 알림을 보내줍니다. 먼저 이 폰을 등록해 주세요.';
      btn.textContent = '알림 받기 켜기';
    }
  };
  await show();

  btn.onclick = async () => {
    try{
      let sub = await reg.pushManager.getSubscription();
      if(!sub){
        const perm = await Notification.requestPermission();
        if(perm !== 'granted'){ toast('알림을 허용해야 켤 수 있어요'); return show(); }
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: b64ToBytes(VAPID_PUBLIC)
        });
      }
      document.getElementById('subTxt').value = JSON.stringify(sub);
      box.classList.remove('hide');
      await show();
      toast('등록됐습니다');
    }catch(e){ toast('켜지 못했습니다: ' + e.message); }
  };
  test.onclick = () => reg.showNotification('오늘 딱 한 문장', {
    body: '오늘 카드 한 장 열어볼까요?', icon: './icon-192.png', tag: 'daily'
  });
  document.getElementById('copyBtn').onclick = async () => {
    const t = document.getElementById('subTxt');
    try{ await navigator.clipboard.writeText(t.value); toast('복사했습니다'); }
    catch(e){ t.select(); document.execCommand('copy'); toast('복사했습니다'); }
  };
}

function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('내려받았습니다');
}
function report(){
  const si = streakInfo();
  return {
    기간: { 시작: DB.startDate, 오늘: todayStr(), 연_일수: si.total, 최고_연속: DB.bestStreak || si.run },
    약속: DB.pledge,
    문장별: Object.values(DB.cards).sort((a,b)=>a.day-b.day).map(c => {
      const s = byDay(c.day), rev = c.log.filter(l => l.m !== 'new');
      return {
        day: s.day, 영어: s.en,
        배운날: c.learnedOn,
        복습횟수: rev.length,
        바로말함: rev.filter(l=>l.m==='ok').length,
        헷갈림: rev.filter(l=>l.m==='mid').length,
        못말함: rev.filter(l=>l.m==='no').length,
        현재단계: c.step,
        기록: c.log
      };
    }),
    연_날짜: Object.keys(DB.days).sort(),
  };
}

/* ═══════════════ 탭 ═══════════════ */
function switchTab(name){
  ['Today','Box','Log','Set'].forEach(n =>
    document.getElementById('tab'+n).classList.toggle('hide', n !== name));
  document.querySelectorAll('nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === name));
  if(name === 'Today') renderToday();
  if(name === 'Box')   renderBox();
  if(name === 'Log')   renderLog();
  if(name === 'Set')   renderSet();
}
function renderAll(){ renderToday(); renderBox(); renderLog(); }

  document.getElementById('plT').textContent = timeLabel(document.getElementById('setTime').value);
  document.getElementById('plC').textContent = document.getElementById('setCue').value;
}

  if(DB) DB.pledge = { time, cue };
  else   DB = fresh(time, cue);
  save();
  document.getElementById('setup').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  stage = null; switchTab('Today');
};
document.getElementById('sheetClose').onclick = closeSheet;
document.getElementById('sheetWrap').onclick = e => { if(e.target.id === 'sheetWrap') closeSheet(); };
document.getElementById('mClose').onclick = closeType;
document.getElementById('mGo').onclick = () => {
  if(!typeCtx) return;
  const r = typeCheck(document.getElementById('mIn').value, typeCtx.en);
  const msg = document.getElementById('mMsg');
  if(r.rate === 1 && !r.extra.length){
    msg.innerHTML = '<div class="fb ok">정답!</div>';
    typeTries[typeCtx.key] = 0;
    const win = typeCtx.onWin;
    setTimeout(() => { closeType(); if(win) win(); }, 700);
    return;
  }
  typeTries[typeCtx.key] = (typeTries[typeCtx.key] || 0) + 1;
  msg.innerHTML = '<div class="fb no"><span class="t">다시 생각해보세요</span>'
    + '<div class="ans" style="font-size:14px;color:var(--soft)">' + typeTries[typeCtx.key] + '번째</div></div>'
    + hintHTML(typeCtx.en, typeCtx.key);
};
document.getElementById('mIn').onkeydown = e => { if(e.key === 'Enter') document.getElementById('mGo').onclick(); };
document.getElementById('typeModal').onclick = e => { if(e.target.id === 'typeModal') closeType(); };

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  if(b.dataset.tab === 'Learn'){ openLearn(); return; }
  closeLearn();
  switchTab(b.dataset.tab);
});
document.getElementById('gearBtn').onclick = () => switchTab('Set');
document.getElementById('setClose').onclick = () => switchTab('Log');

paintAccent();
if(!DB){ DB = fresh('07:00', '이불에서 나오기 전'); save(); }   /* 약속 화면은 설정에서만 */
tidy();
document.getElementById('setup').classList.add('hide');
document.getElementById('app').classList.remove('hide');
switchTab('Today');

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
