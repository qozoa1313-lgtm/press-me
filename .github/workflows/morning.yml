# 매일 아침 「오늘 딱 한 문장」 알림 보내기
name: 아침 알림

on:
  schedule:
    # UTC 기준입니다. 한국 시간 = UTC + 9시간 (UTC 쪽은 하루 전날이 됩니다)
    # 한 번 버려져도 다른 하나가 가도록 두 번 쏩니다.
    #   22:47 UTC  →  한국 아침 7:47
    #   23:47 UTC  →  한국 아침 8:47
    # 정각·UTC 자정은 전 세계 작업이 몰려 밀리거나 버려지므로 피했습니다.
    - cron: '47 22 * * *'
    - cron: '47 23 * * *'
  workflow_dispatch:        # 깃허브에서 손으로 눌러 바로 보낼 수도 있습니다

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install web-push@3 --no-save
      - run: node english/push/send.js
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SUBSCRIPTION:  ${{ secrets.SUBSCRIPTION }}
